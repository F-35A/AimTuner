name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      AIMTUNER_LANG: ko
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pygame==2.6.1 "numpy<2.3" pytest pyinstaller

      - name: Test
        run: pytest -q tests

      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name AimTuner --icon icon.ico --add-data "icon.png;." --exclude-module tkinter --exclude-module fakeplat app.py

      - name: Smoke run
        shell: pwsh
        run: |
          $env:AIMTUNER_SMOKE = "3"
          $p = Start-Process dist\AimTuner.exe -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "EXE did not exit" }
          if ($p.ExitCode -ne 0) { throw "EXE exit code $($p.ExitCode)" }

      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          New-Item -ItemType Directory -Force -Path pkg\AimTuner | Out-Null
          Copy-Item dist\AimTuner.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.txt, CHANGELOG.md pkg\AimTuner\
          Compress-Archive -Path pkg\AimTuner -DestinationPath "AimTuner-$name-windows.zip"
          "ZIP=AimTuner-$name-windows.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: AimTuner-windows
          path: ${{ env.ZIP }}

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          body_path: CHANGELOG.md
